[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shakebench"
version = "0.2.0"
description = "ShakeBench: an embodied-intelligence manipulation benchmark under multi-axis vibration on Isaac Lab + Newton/MJWarp"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["embodied-ai", "manipulation", "benchmark", "isaac-lab", "newton", "vibration", "robotics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy", "torch", "imageio", "imageio-ffmpeg", "pillow", "pyyaml", "gymnasium>=1.0", "h5py>=3.10"]

[project.scripts]
shakebench = "shakebench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/shakebench/configs" = ["configs/*.yaml"]
"share/shakebench/configs/suites" = ["configs/suites/*.yaml"]
"share/shakebench/assets/textures" = ["assets/textures/*.jpg"]

[tool.setuptools.package-data]
shakebench = ["controllers/config/*.json", "init_files/*.hdf5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
