[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibration-benchmark-v2"
version = "0.1.0"
description = "Asset-backed Isaac Lab + Newton vibrating manipulation benchmark"
requires-python = ">=3.11"
dependencies = ["numpy", "torch", "imageio", "imageio-ffmpeg", "pillow", "pyyaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
