[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shakebench"
version = "0.1.0"
description = "Benchmark for evaluating robot manipulation policies on a vibrating worktable (robosuite + MuJoCo)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    # Upstream robosuite master after 1.5.2, unmodified. ShakeBench extends it in shakebench/environments/base.py;
    # Compare all task rollouts before moving this pin.
    "robosuite @ git+https://github.com/ARISE-Initiative/robosuite.git@5ce6643f3092639d08f7b0f90ed1c6a84f50552c",
    # MuJoCo 3.10 changed mj_fullM, which robosuite's controllers call.
    "mujoco>=3.3.0,<3.10",
    "numpy",
    "scipy",
    "Pillow",
    "PyYAML>=5.3",
    "opencv-python",
]

[project.optional-dependencies]
# Local LeRobot-style checkpoints: shakebench.policies.pretrained and shakebench.policies.async_policy.
policies = ["torch", "safetensors", "draccus"]
# Gym/Gymnasium interface; robosuite's wrappers package also imports h5py.
gym = ["gymnasium", "h5py"]
dev = ["pytest", "pyflakes", "black==24.10.0", "isort==5.13.2", "pre-commit"]

[tool.setuptools.packages.find]
include = ["shakebench*"]

[tool.setuptools.package-data]
shakebench = ["models/assets/**/*"]

[tool.black]
line-length = 120
target-version = ["py310"]
extend-exclude = "shakebench/models/assets"

[tool.isort]
profile = "black"
line_length = 120
skip = ["__init__.py"]
extend_skip = ["shakebench/models/assets"]
