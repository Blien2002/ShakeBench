run_id: starvla_qwenoft_shakebench_2b
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starVLA_ShakeBench
is_debug: false
version_id: "0.21"

# ShakeBench gamma=0 oracle SFT (success-only subset exported by
# robosuite.scripts.shakebench_export_sft_subset).
# QwenOFT: Qwen3-VL backbone + MLP action head over the action special token.
# Data contract: normalized OSC delta (6D) + gripper, 20 Hz, action_horizon 8.
framework:
  name: QwenOFT
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-2B-Instruct
    attn_implementation: flash_attention_2
    # Wired in starVLA/model/modules/vlm/QWen3.py; the trainer-level
    # gradient_checkpointing flag is dead config in this commit.
    enable_gradient_checkpointing: true
  action_model:
    action_model_type: MLP
    action_dim: 7
    action_horizon: 8

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: playground/Datasets/ShakeBench
    data_mix: shakebench
    lerobot_version: v2.0
    action_mode: abs
    include_state: false
    obs_image_size: [224, 224]
    video_backend: torchvision_av
    # 4090 24GB full finetune with gradient checkpointing; batch 4 keeps a
    # comfortable memory margin, batch 8 ran at ~24G/card without OOM.
    per_device_batch_size: 4
    load_all_data_for_training: true
    delete_pause_frame: false

trainer:
  max_train_steps: 8000
  num_warmup_steps: 500
  save_interval: 1000
  eval_interval: 1000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 20
  gradient_clipping: 1.0
  # Note: gradient_accumulation_steps / gradient_checkpointing are not read by
  # this StarVLA commit's train_starvla.py; accumulation comes from
  # starVLA/config/deepseeds/ds_config.yaml (currently 1).

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
