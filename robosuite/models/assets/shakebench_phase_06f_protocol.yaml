selection:
  primary: eligibility
  secondary: minimal_intervention_priority
  minimal_intervention_priority: [c3_nominal, n6_critical_negative_control, n6_overdamped_2, n6_overdamped_4]
  binding_rule: contact_candidate_id = selection.contact_winner
  drop_stress_score_used: false

contact:
  task_native_states:
    open_worktable: {xy_m: [-0.10, -0.13], support_top_z_m: 0.80}
    target_bottom: {xy_m: [-0.10, 0.17], support_top_z_m: 0.812}
  gamma: 0.0
  action: zero
  settle_duration_s: 0.50
  final_window_s: 0.10
  slip_initial_speed_m_s: 0.05
  slip_duration_s: 0.50
  finger_load_duration_s: 0.10
  timestep_candidates_s: [0.0001, 0.000125, 0.0002]
  force_threshold:
    fixture: raw_mujoco_task_geometry_level_horizontal_body_com_force
    reference_mu: 0.30
    mass_kg: 0.349
    gravity_m_s2: 9.81
    analytic_reference: F_mu = reference_mu * mass_kg * gravity_m_s2
    force_factors: [0.0, 0.5, 0.8, 1.0, 1.2, 1.5]
    plateau_duration_s: 0.25
    reset_to_identical_settled_state_each_plateau: true
    static_displacement_max_m: 0.0005
    monotonic_tolerance_m: 1.0e-7
    bracket_relative_tolerance: 0.50
  hard_gates:
    named_support_final_window_required: true
    linear_speed_max_m_s: 0.02
    angular_speed_max_rad_s: 0.20
    maximum_illegal_penetration_m: 0.0005
    finite_contact_forces_required: true
    warning_count_max: 0
    transverse_drift_max_m: 0.0005
    slip_final_speed_max_m_s: 0.05
    finger_force_min_N: 0.001
    finger_force_max_N: 40.0
    finger_penetration_max_m: 0.0005
    timestep_trace_relative_error_max: 0.10
  public_diagnostics_not_gates: [drop_15cm_recovery, inclined_plane_threshold_bracket, placement, free_table_slip, in_hand_slip, contact_loss]

parity:
  gamma: 0.0
  zero_action: true
  duration_s: 1.0
  action_dimension: 7
  control_frequency_hz: 20.0
  worktable_mass_kg: 32.0
  can_mass_kg: 0.349
  target_inner_xy_m: [0.164, 0.144]
  target_outer_xy_m: [0.18, 0.16]
  dynamic_residual_report_only: true

