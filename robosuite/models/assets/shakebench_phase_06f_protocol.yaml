    contact_binding: selection.contact_winner
    state_id_template: parity.gamma_zero.{contact_candidate_id}.{selection_artifact_sha256}
    output_template: shakebench_phase_06f_raw_parity_gamma_zero_{contact_candidate_id}_{selection_artifact_sha256}.json
  - group: driver
    process_index: 1
    contact_binding: selection.contact_winner
    state_id_template: replay.driver.process_1.{contact_candidate_id}.{selection_artifact_sha256}
    output_template: shakebench_phase_06f_raw_replay_driver_process_1_{contact_candidate_id}_{selection_artifact_sha256}.json
  - group: driver
    process_index: 2
    contact_binding: selection.contact_winner
