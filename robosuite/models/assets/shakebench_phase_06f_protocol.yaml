    output_template: shakebench_phase_06f_raw_replay_contact_process_2_{contact_candidate_id}_{selection_artifact_sha256}.json
  - group: contact
    process_index: 3
    contact_binding: selection.contact_winner
    state_id_template: replay.contact.process_3.{contact_candidate_id}.{selection_artifact_sha256}
    output_template: shakebench_phase_06f_raw_replay_contact_process_3_{contact_candidate_id}_{selection_artifact_sha256}.json
  - group: gamma_zero_parity_replay
    process_index: 1
    contact_binding: selection.contact_winner
    state_id_template: replay.gamma_zero_parity.process_1.{contact_candidate_id}.{selection_artifact_sha256}
    output_template: shakebench_phase_06f_raw_replay_gamma_zero_parity_process_1_{contact_candidate_id}_{selection_artifact_sha256}.json
  - group: gamma_zero_parity_replay
    process_index: 2
    contact_binding: selection.contact_winner
    state_id_template: replay.gamma_zero_parity.process_2.{contact_candidate_id}.{selection_artifact_sha256}
    output_template: shakebench_phase_06f_raw_replay_gamma_zero_parity_process_2_{contact_candidate_id}_{selection_artifact_sha256}.json
  - group: gamma_zero_parity_replay
    process_index: 3
    contact_binding: selection.contact_winner
    state_id_template: replay.gamma_zero_parity.process_3.{contact_candidate_id}.{selection_artifact_sha256}
    output_template: shakebench_phase_06f_raw_replay_gamma_zero_parity_process_3_{contact_candidate_id}_{selection_artifact_sha256}.json
  - group: selected_diagnostics
    contact_binding: selection.contact_winner
    state_id_template: diagnostics.drop_incline.{contact_candidate_id}.{selection_artifact_sha256}
    output_template: shakebench_phase_06f_selected_diagnostics_{contact_candidate_id}_{selection_artifact_sha256}.json

replay:
  process_count: 3
  groups: [driver, isolator, contact, gamma_zero_parity_replay]
  compare: complete_trace_digest_and_metric_digest
  same_process_reset_allowed: false

failure_taxonomy: [invalid_protocol_configuration, physics_gate_failure, infrastructure_failure, evidence_integrity_failure]
retry_policy: {infrastructure_crash: retry_same_state_config_once, repeated_failure: blocked, replacement_candidate_or_seed: forbidden}

