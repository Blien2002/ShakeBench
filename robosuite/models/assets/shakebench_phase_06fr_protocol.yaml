real_environment:
  environment_class: robosuite.environments.manipulation.vibration_pick_place_can.VibrationPickPlaceCan
  fixture_forbidden: [raw_contact_xml, shakebench_contact_force, reduced_support_box]
  renderer: disabled
  robot: Panda
  excitation: {Gamma: 0.0, seed: 17, action_dimension: 7, action: zero}
  support_states:
    - state_id: real.open_worktable
      support: open_worktable
      xy_m: [-0.10, -0.13]
      output_template: shakebench_phase_06fr_raw_real_open_{timestep_token}.json
    - state_id: real.target_bottom
      support: target_bottom
      xy_m: [-0.10, 0.17]
      output_template: shakebench_phase_06fr_raw_real_target_{timestep_token}.json
  timestep_candidates_s: [0.0001, 0.000125, 0.0002]
  control_frequency_hz: 20.0
  common_sample_rate_hz: 200.0
  settle_duration_s: 0.50
  final_window_s: 0.10
  hard_gates:
    linear_speed_max_m_s: 0.02
    angular_speed_max_rad_s: 0.20
    maximum_illegal_penetration_m: 0.0005
    warning_count_max: 0
    finite_required: true
    named_support_required: true

trace_schema:
  id: shakebench.phase06fr.real_environment_trace
  version: 1
  timestamp_field: time_s
  required_fields:
    - time_s
    - can_pose_worktable
    - can_twist_worktable
    - can_pose_target
    - can_twist_target
    - worktable_pose_deck
    - worktable_twist_deck
    - worktable_acceleration_deck
    - deck_pose
    - deck_twist
    - deck_acceleration
    - contacts
    - penetration_m
    - support_force_N
    - tangential_impulse_Ns
    - normal_impulse_Ns
    - normalized_action
    - decoded_action
    - clipped_action
    - applied_control
    - warning_number
    - finite_state
  expected_dtypes: {time_s: float64, numeric: float64, warning_number: int64, finite_state: bool}
  expected_samples_by_timestep: {0.0001: 5000, 0.000125: 4000, 0.0002: 2500}
  timestamp_grid: right_limit_200_hz_from_0.005_s_to_0.500_s

convergence:
  reference_timestep_s: 0.0002
  compare_timestep_s: [0.0001, 0.000125]
  fields: [can_pose_worktable, can_twist_worktable, worktable_pose_deck, worktable_twist_deck, worktable_acceleration_deck, contacts.named_support_contact, penetration_m, normal_impulse_Ns, tangential_impulse_Ns, support_force_N]
  tolerances:
    position_absolute_m: 0.0005
    orientation_absolute_rad: 0.01
    velocity_absolute_m_s: 0.05
    angular_velocity_absolute_rad_s: 0.20
    relative_metric_max: 0.10
    impulse_absolute_Ns: 0.05
    force_rms_absolute_N: 0.50
    warning_sequence_exact: true
  negative_control: {transient_mutation_must_fail: true}

parity:
  state_id: parity.gamma_zero.real_environment
  output: shakebench_phase_06fr_raw_parity_gamma_zero.json
  required_fields: [profile_id, profile_sha256, timestep_s, control_frequency_hz, action_dimension, normalized_action, decoded_action, clipped_action, applied_control, panda_base_pose, worktable_pose, can_pose, target_geometry, target_frame, support_contact, relative_pose_twist, penetration_m, evaluator_contract_hash, success_thresholds, policy_observation_keys, privileged_truth_excluded, warning_number, finite_state]
  evaluator_contract_hash: phase04_vibration_success_evaluator
  success_thresholds_hash: phase04_default_success_thresholds
  success_outcome_not_selection_input: true

replay:
  process_count: 3
  groups: [parity, contact]
  complete_trace_required: true
  output_templates:
    parity: shakebench_phase_06fr_raw_replay_parity_process_{process_index}.json
    contact: shakebench_phase_06fr_raw_replay_contact_process_{process_index}.json
  required_trace_digest_fields: [schema_id, schema_version, sample_count, timestamp_digest, field_digests, shapes, dtypes, whole_trace_digest]
  same_process_reset_allowed: false

