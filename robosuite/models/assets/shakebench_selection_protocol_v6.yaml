schema_id: shakebench.phase06r5.v6.physics_selection_protocol
schema_version: 6
phase: 06R5
status: pre_registered
immutable_after_registration: true
selection_authority: physics_probes_only
registration_commit: recorded_in_feasibility_and_status

scope:
  forbidden_selection_inputs: [task_success, reward, success_evaluator, controller_outcome, state_tier_ranking, policy_observation, Gamma_star]
  allowed_selection_inputs: [v6_protocol, frozen_phase01_to_phase05_physical_facts, raw_mujoco_state, raw_solver_diagnostics]

