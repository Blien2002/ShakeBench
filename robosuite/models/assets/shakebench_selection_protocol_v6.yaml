parity:
  static_duration_s: 1.0
  dynamic_duration_s: 1.0
  geometry_tolerance_m: 1.0e-12
  action_dimension_exact: true
  action_dimension: 7
  support_force_min_N: 0.001
  support_force_tolerance_N: 1.0e-12
  expected_geometry: {worktable_mass_kg: 32.0, worktable_inertia_kg_m2: [0.9696, 1.1363, 2.0867], can_mass_kg: 0.349, target_outer_xy_m: [0.18, 0.16], target_inner_xy_m: [0.164, 0.144], target_wall_height_m: 0.035, target_bottom_thickness_m: 0.012}
  expected_action: {dimension: 7, control_freq_hz: 20.0}
  expected_support: {interface: can_open_worktable, minimum_force_N: 0.001}
  dynamic_residual_report_only: true

replay:
  process_count: 3
  groups: [driver, isolator, contact, gamma_zero_parity]
  compare: complete_declared_sampled_trace_schema
  determinism_tolerances: {time_absolute_s: 1.0e-12, state_absolute: 1.0e-10, metric_absolute: 1.0e-10, integer_exact: true}
  trace_fields: [integration_target_time_s, sample_target_time_s, integration_application_time_s, sample_application_time_s, sample_time_s, command_pose, actual_pose, command_twist, actual_twist, command_acceleration, actual_acceleration, sample_target_pose, sample_target_twist, sample_target_acceleration, deck_tracking_pose_error, weld_constraint_residual_raw, weld_constraint_force_raw, solver_iterations, solver_niter, warning_number_delta, warning_lastinfo]

failure_taxonomy: [invalid_protocol_configuration, physics_gate_failure, infrastructure_failure, evidence_integrity_failure]
failure_integrity: {infrastructure_crash: retry_same_state_config_once, repeated_infrastructure_crash: group_incomplete_and_blocked, replacement_seed_or_candidate: forbidden, missing_trace: blocked, raw_artifact_mutation: blocked}

