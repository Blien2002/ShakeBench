schema_id: shakebench.phase06r2.physics_selection_protocol
schema_version: 3
phase: 06R2
status: pre_registered
selection_authority: physics_probes_only
immutable_after_first_v3_probe: true
registration:
  normalized_hash_scope: canonical_yaml_bytes
  registration_commit_sha: recorded_in_v3_artifacts_after_the_single_protocol_commit
  note: A Git commit cannot contain its own SHA without a circular hash; the immutable file hash is recorded in every V3 artifact.

scope:
  forbidden_selection_inputs: [task_success, reward, success_evaluator, controller_outcome, state_tier_ranking, policy_observation, Gamma_star]
  allowed_inputs: [v3_protocol, frozen_phase01_to_phase05_physical_facts, raw_mujoco_physics_traces]

frozen_facts:
  f_max_hz: 8.87
  authored_spectrum: {seed: 17, t0_s: 0.0, line_count: 64, transient_discard_s: 0.75}
  safe_gamma_candidates: [0.15, 0.30, 0.50]
  load_cases: [empty, panda_plus_worktable_reference_proxy]
  gravity_m_s2: 9.81
  table_mass_kg: 32.0
  table_inertia_kg_m2: [0.9696, 1.1363, 2.0867]
  can_mass_kg: 0.349
  table_geometry_friction: [1.0, 0.005, 0.0001]
  sliding_mu: {table_object: 0.30, finger_object: 1.00}

measurement:
  trace_schema_id: shakebench.deck_driver.trace
  trace_schema_version: 3
  sampling_phase_rule: post-integration right-limit refresh; actual state sampled at data.time
  no_skipped_mujoco_steps: true
  bounded_measurement_trace: true
  cadence_by_driver_candidate_hz: {dt_fine: 200.0, dt_medium: 196.07843137254903, dt_nominal: 200.0}
  refresh_stride_by_driver_candidate: {dt_fine: 50, dt_medium: 34, dt_nominal: 25}
  minimum_cadence_hz: 177.4
  spectrum_fit_window: two_minimum_line_spacings
  capacity_preflight_artifact: shakebench_phase_06r2_capacity_preflight.json

# This is an explicit finite composed table, not a Cartesian product generated by code.
composed_candidates:
  - candidate_id: fine_balanced_c3
    driver: {candidate_id: dt_fine, physics_timestep_s: 0.0001, integrator: Euler, solver: Newton, iterations: 100, tolerance: 1.0e-12, deck_mass_kg: 400.0, deck_inertia_kg_m2: [12.12, 14.083333333333334, 26.033333333333332], deck_eq_solref: [0.0002, 0.5], deck_eq_solimp: [0.9, 0.95, 0.001, 0.5, 2.0]}
    isolator: {candidate_id: balanced_nominal, fn_hz: [5.0, 5.0, 5.0, 4.0, 4.0, 2.5], zeta: [0.10, 0.10, 0.10, 0.10, 0.10, 0.10]}
    contact: {candidate_id: c3_nominal, condim: 3, torsional_mu: 0.005, rolling_mu: 0.0001, margin_m: 0.0, gap_m: 0.0, solref: [0.0004, 1.0], solimp: [0.9, 0.95, 0.001, 0.5, 2.0], iterations: 100}
  - candidate_id: medium_low_c3soft
    driver: {candidate_id: dt_medium, physics_timestep_s: 0.00015, integrator: Euler, solver: Newton, iterations: 100, tolerance: 1.0e-12, deck_mass_kg: 400.0, deck_inertia_kg_m2: [12.12, 14.083333333333334, 26.033333333333332], deck_eq_solref: [0.0003, 0.5], deck_eq_solimp: [0.9, 0.95, 0.001, 0.5, 2.0]}
    isolator: {candidate_id: low_frequency_damped, fn_hz: [4.0, 4.0, 4.0, 3.0, 3.0, 2.0], zeta: [0.20, 0.20, 0.20, 0.20, 0.20, 0.20]}
    contact: {candidate_id: c3_softer, condim: 3, torsional_mu: 0.005, rolling_mu: 0.0001, margin_m: 0.0, gap_m: 0.0, solref: [0.001, 1.0], solimp: [0.9, 0.95, 0.002, 0.5, 2.0], iterations: 100}
  - candidate_id: nominal_high_c4
    driver: {candidate_id: dt_nominal, physics_timestep_s: 0.0002, integrator: Euler, solver: Newton, iterations: 100, tolerance: 1.0e-12, deck_mass_kg: 400.0, deck_inertia_kg_m2: [12.12, 14.083333333333334, 26.033333333333332], deck_eq_solref: [0.0004, 0.5], deck_eq_solimp: [0.9, 0.95, 0.001, 0.5, 2.0]}
    isolator: {candidate_id: high_frequency_light_damping, fn_hz: [6.0, 6.0, 6.0, 5.0, 5.0, 3.0], zeta: [0.05, 0.05, 0.05, 0.05, 0.05, 0.05]}
    contact: {candidate_id: c4_torsional, condim: 4, torsional_mu: 0.005, rolling_mu: 0.0001, margin_m: 0.0, gap_m: 0.0, solref: [0.0004, 1.0], solimp: [0.9, 0.95, 0.001, 0.5, 2.0], iterations: 100}

driver:
  convergence_candidate_ids: [dt_fine, dt_medium, dt_nominal]
  negative_control: {candidate_id: dt_coarse_negative_control, physics_timestep_s: 0.0004, integrator: Euler, solver: Newton, iterations: 100, tolerance: 1.0e-12, deck_eq_solref: [0.0008, 0.5], never_counts_as_convergence_pass: true}
  hard_gates: {line_amplitude_relative_error_max: 0.01, line_phase_absolute_error_deg_max: 1.0, gamma_deck_relative_error_max: 0.01, warning_count_max: 0, unstable_residual_max: 0.001, min_convergence_passes: 3}
  selection: {primary: maximum_dt_among_complete_passes, secondary: minimum_max_absolute_line_phase_error_deg, tertiary: candidate_id_lexicographic_ascending}
  required_matrix: every_safe_gamma_x_every_load_x_complete_64_line_spectrum

isolator:
  candidate_ids: [balanced_nominal, low_frequency_damped, high_frequency_light_damping]
  regions: {tracking_ratio: 0.2, resonance_ratio: 1.0, isolation_ratio: 2.0, transient_cycles: 10, fit_cycles: 20}
  combined_spectrum: {seed: 17, t0_s: 0.137, level_scale: 0.30, transient_discard_s: 0.75, line_count: 64}
  payload: {mass_kg: 0.349, com_offsets_m: [[0.0, 0.0], [0.10, 0.0], [0.0, 0.20], [0.10, 0.20]], settle_duration_s: 8.0, equilibrium_window_s: 1.0}
  targets: {R_relative_median: 1.0, T_peak: 4.0, T_accel_mean: 1.025, D_relative_m: 0.005, travel_margin_min_m: 0.015, static_sag_uncompensated_m: 0.010, static_offset_compensated_payload_max_m: 0.0025, payload_sensitivity: 0.175}
  hard_gates: {T_accel_mean_min: 0.05, T_accel_mean_max: 2.0, T_peak_max: 8.0, travel_margin_min_m: 0.005, static_sag_uncompensated_max_m: 0.020, static_offset_compensated_payload_max_m: 0.005, payload_sensitivity_max: 0.35, analytic_mujoco_amplitude_relative_error_max: 0.10, analytic_mujoco_phase_absolute_error_deg_max: 6.0, cross_axis_leakage_max: 0.05, warnings_max: 0}
  scoring: {weights: {R_relative_median: 2.0, T_peak: 2.0, T_accel_mean: 1.0, D_relative_m: 1.0, travel_margin_min_m: 2.0, static_sag_uncompensated_m: 1.0, static_offset_compensated_payload_max_m: 1.0, payload_sensitivity: 1.0}, primary: weighted_normalized_distance_ascending, secondary: minimum_normalized_margin_descending, tertiary: candidate_id_lexicographic_ascending}

contact:
  candidate_ids: [c3_nominal, c3_softer, c4_torsional]
  interfaces: [can_open_worktable, can_target_bottom, can_target_walls, can_panda_finger_pads]
  probes: {static_support_settle_s: 1.0, incline_angles_rad: [0.10, 0.20, 0.2914567944778671, 0.35], slip_initial_speed_m_s: 0.05, slip_duration_s: 0.50, impact_drop_height_m: 0.15, recovery_duration_s: 0.50, finger_load_duration_s: 0.10, timestep_candidates_s: [0.0001, 0.00015, 0.0002]}
  hard_gates: {static_support_force_min_N: 0.001, incline_threshold_relative_error_max: 0.10, slip_threshold_relative_error_max: 0.10, maximum_illegal_penetration_m: 0.0005, recovery_velocity_max_m_s: 0.02, recovery_angular_velocity_max_rad_s: 0.20, finger_force_min_N: 0.001, warning_count_max: 0, timestep_trace_relative_error_max: 0.10}
  scoring: {weights: {incline_threshold_relative_error: 3.0, slip_threshold_relative_error: 3.0, maximum_penetration_m: 2.0, recovery_velocity_m_s: 1.0, finger_force_relative_error: 1.0, timestep_trace_relative_error: 2.0}, primary: weighted_normalized_physics_error_ascending, secondary: maximum_illegal_penetration_ascending, tertiary: candidate_id_lexicographic_ascending}

gamma_zero_bounded_parity: {duration_s: 1.0, geometry_absolute_m: 1.0e-12, action_dimension_exact: true, passive_support_force_min_N: 0.001, dynamic_residual_report_only: true}
determinism: {independent_processes: 3, groups: [driver, isolator, contact, gamma_zero_parity], compare: complete_declared_sampled_trace_schema, time_absolute_s: 1.0e-12, state_absolute: 1.0e-10, metric_absolute: 1.0e-10, integer_exact: true}
failure_integrity: {infrastructure_crash: rerun_same_state_config_once, repeated_same_state_crash: group_incomplete_and_blocked, replacement_seed_or_candidate: forbidden, missing_trace: blocked, raw_artifact_mutation: blocked}
artifacts:
  prefix: shakebench_phase_06r2_
  capacity_preflight: shakebench_phase_06r2_capacity_preflight.json
  selected: shakebench_phase_06r2_selected_candidates.json
  excluded: shakebench_phase_06r2_excluded_candidates.json
  parity: shakebench_phase_06r2_gamma_zero_parity.json
  determinism: shakebench_phase_06r2_replay_determinism.json
  status: shakebench_phase_06r2_status.json
