name: ci
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install black==24.10.0 isort==5.13.2
      - run: black --check shakebench tools tests
      - run: isort --check-only shakebench tools tests
  test:
    runs-on: ubuntu-22.04
    env:
      MUJOCO_GL: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e ".[dev,gym]"
      - run: pytest -q
