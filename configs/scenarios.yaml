schema_version: 5
common:
  robot: franka_panda
  table: phenolic_worktable_c2
  support_layout: C2_hard_mount
  support_config: C2_CLITE
  solver_iterations: 50
  workpieces: [cracker_box, sugar_box, soup_can, mustard_bottle]
  default_workpiece_scale: 0.75
  gamma: 0.50
  frequency_scale: 1.0
  ballistic_allowed: false
physics_profiles:
  official:
    physics_hz: 1000
    substeps: 4
    support_config: C2_CLITE
    solver_iterations: 50
    contact_solref: [0.00060, 1.0]
    scoreable: true
    penetration_threshold_ratio: 0.01
    note: Evaluation and recording profile; threshold is 1% of the selected workpiece's thinnest collider dimension.
  training:
    physics_hz: 240
    substeps: 4
    contact_solref: [0.0025, 1.0]
    scoreable: false
    note: Throughput profile; larger single-step travel can increase penetration.
contact_policy:
  requested_pair_margin_m: 0.001
  backend_limit: MuJoCo NativeCCD zeroes authored margins with use_mujoco_contacts=true.
  mitigation: Official scoring uses C2_CLITE 1000 Hz x 4 substeps with mocap support injection and records signed contact distance.
controller_policy:
  approach_clearance_m: 0.080
  nominal_descend_clearance_m: 0.004
  finger_table_clearance_m: 0.012
  runtime_descend_rule: Raise the finger-body target using the live finger collider reach and workpiece height.
  arm_linear_speed_m_s: 0.15
  lift_takeoff_speed_m_s: 0.012
  lift_takeoff_duration_s: 1.20
  descend_linear_speed_m_s: 0.060
  place_linear_speed_m_s: 0.080
  gripper_closing_speed_m_s: 0.010
  gripper_contact_recovery_speed_m_s: 0.001
  gripper_opening_speed_m_s: 0.040
  gripper_contact_preload_m: 0.0003
  grasp_timeout_s: 6.0
  grasp_settle_s: 0.30
  grasp_contact_loss_timeout_s: 0.20
  grasp_slip_tolerance_m: 0.010
  table_contact_during_descend: fail
  contact_loss_during_transport: fail
scenarios:
  clean_baseline:
    vibration: off
    seeds: [0]
  z_sweep_control:
    vibration: sweep
    axis: tz
    frequency_hz: 5.0
    gamma: 0.50
    seeds: [0]
    note: Single-axis narrowband sweep calibrated to Gamma=0.50.
  z_sine_control:
    vibration: sine
    axis: tz
    frequency_hz: 5.0
    gamma: 0.50
    seeds: [0]
    note: Deprecated alias of z_sweep_control; 'sine' remains for one release cycle.
  legacy_random_6dof:
    vibration: spectral
    gamma: 0.50
    frequency_scale: 1.0
    axes: [tx, ty, tz, rx, ry, rz]
    seeds: [17, 31, 47, 73, 101]
    note: Contact-preserving replacement for the old spectral_scale=1.0 family; displacement and acceleration are no longer tied by a single scale.
  safe_full_6dof_demo:
    vibration: spectral
    gamma: 0.15
    frequency_scale: 1.0
    axes: [tx, ty, tz, rx, ry, rz]
    seeds: [17]
    note: Mild full-6DOF visualization profile inside the contact-preserving wedge.
  vehicle_longitudinal_2dof_demo:
    vibration: spectral
    gamma: 0.50
    frequency_scale: 1.0
    axes: [tx, tz]
    bands:
      tx:
        - {center_hz: 5.0, accel_rms: 0.50, bandwidth_ratio: 0.12, tones: 8}
      tz:
        - {center_hz: 8.0, accel_rms: 1.00, bandwidth_ratio: 0.10, tones: 10}
    workpiece: sugar_box
    workpiece_scale: 0.55
    gripper_closing_speed_m_s: 0.006
    grasp_timeout_s: 4.5
    episode_s: 20.0
    seeds: [17]
    note: Longitudinal vehicle-plane demo with vertical-dominant acceleration; calibrated to Gamma=0.50.
  vehicle_longitudinal_3dof_demo:
    vibration: spectral
    gamma: 0.50
    frequency_scale: 1.0
    axes: [tx, tz, ry]
    bands:
      tx:
        - {center_hz: 5.0, accel_rms: 0.50, bandwidth_ratio: 0.12, tones: 8}
      tz:
        - {center_hz: 8.0, accel_rms: 1.00, bandwidth_ratio: 0.10, tones: 10}
      ry:
        - {center_hz: 4.0, accel_rms: 0.461538, bandwidth_ratio: 0.12, tones: 8}
    workpiece: sugar_box
    workpiece_scale: 0.55
    gripper_closing_speed_m_s: 0.006
    grasp_timeout_s: 4.5
    episode_s: 20.0
    seeds: [17]
    note: Longitudinal vehicle demo with X/Z translation plus pitch, producing arm-table differential motion; calibrated to Gamma=0.50.
  panel_operation:
    task: panel_operation
    vibration: off
    episode_s: 24.0
    seeds: [0, 17, 31, 47, 73]
    note: Fixed control panel on the existing C2 worktable; each seed samples a random ordered subset of knob/lever/button as the rollout instruction.
  panel_operation_spectral_demo:
    task: panel_operation
    vibration: spectral
    gamma: 0.30
    frequency_scale: 1.0
    axes: [tx, ty, tz, rx, ry, rz]
    episode_s: 24.0
    seeds: [17]
    note: Panel operation under a Gamma=0.30 contact-preserving 6-DOF spectrum.
  panel_sequence_knob_button:
    task: panel_operation
    vibration: off
    panel_sequence: [knob, button]
    episode_s: 16.0
    seeds: [0]
    note: Explicit two-control instruction (knob then button) for deterministic validation.
  # --- Round-5 Gamma difficulty ladder (all strictly inside Gamma < 1) ---
  ladder_g015:
    vibration: spectral
    gamma: 0.15
    frequency_scale: 1.0
    seeds: [17, 31, 47, 73, 101]
    note: Official difficulty ladder step 1/5; contact-preserving by construction.
  ladder_g030:
    vibration: spectral
    gamma: 0.30
    frequency_scale: 1.0
    seeds: [17, 31, 47, 73, 101]
    note: Official difficulty ladder step 2/5; contact-preserving by construction.
  ladder_g050:
    vibration: spectral
    gamma: 0.50
    frequency_scale: 1.0
    seeds: [17, 31, 47, 73, 101]
    note: Official difficulty ladder step 3/5; contact-preserving by construction.
  ladder_g075:
    vibration: spectral
    gamma: 0.75
    frequency_scale: 1.0
    seeds: [17, 31, 47, 73, 101]
    note: Official difficulty ladder step 4/5; contact-preserving by construction.
  ladder_g095:
    vibration: spectral
    gamma: 0.95
    frequency_scale: 1.0
    seeds: [17, 31, 47, 73, 101]
    note: Official difficulty ladder step 5/5; contact-preserving by construction.
  # --- Round-5 frequency sweep (Gamma fixed at 0.50) ---
  sweep_f025:
    vibration: spectral
    gamma: 0.50
    frequency_scale: 0.25
    seeds: [17, 31, 47, 73, 101]
    note: tz centre 2 Hz. At Gamma=0.50 this point lies outside the displacement wedge (Gamma_max ~0.26); startup is refused with the feasible Gamma_max in the error.
  sweep_f050:
    vibration: spectral
    gamma: 0.50
    frequency_scale: 0.5
    seeds: [17, 31, 47, 73, 101]
    note: tz centre 4 Hz; inside the displacement wedge for Gamma=0.50.
  sweep_f100:
    vibration: spectral
    gamma: 0.50
    frequency_scale: 1.0
    seeds: [17, 31, 47, 73, 101]
    note: tz centre 8 Hz; default frequency, simultaneously activates inertial-load and geometric-mismatch failure modes.
  sweep_f200:
    vibration: spectral
    gamma: 0.50
    frequency_scale: 2.0
    seeds: [17, 31, 47, 73, 101]
    note: tz centre 16 Hz.
  sweep_f400:
    vibration: spectral
    gamma: 0.50
    frequency_scale: 4.0
    seeds: [17, 31, 47, 73, 101]
    note: tz centre 32 Hz.
  # --- Round-5 predictability controls: same Gamma, three bandwidths ---
  predictability_bw000:
    vibration: spectral
    gamma: 0.50
    frequency_scale: 1.0
    axes: [tx, ty, tz, rx, ry, rz]
    bands:
      tz:
        - {center_hz: 8.0, accel_rms: 1.000000, bandwidth_ratio: 0.0, tones: 12}
      tx:
        - {center_hz: 5.0, accel_rms: 0.500000, bandwidth_ratio: 0.0, tones: 12}
      ty:
        - {center_hz: 6.5, accel_rms: 0.350000, bandwidth_ratio: 0.0, tones: 10}
      rx:
        - {center_hz: 3.0, accel_rms: 0.461538, bandwidth_ratio: 0.0, tones: 12}
      ry:
        - {center_hz: 4.0, accel_rms: 0.461538, bandwidth_ratio: 0.0, tones: 10}
      rz:
        - {center_hz: 2.5, accel_rms: 0.230769, bandwidth_ratio: 0.0, tones: 8}
    seeds: [17, 31, 47, 73, 101]
    note: Pure-sine predictability control; bandwidth_ratio=0 collapses each band to one deterministic line.
  predictability_bw010:
    vibration: spectral
    gamma: 0.50
    frequency_scale: 1.0
    seeds: [17, 31, 47, 73, 101]
    note: Default narrowband predictability control (10% relative bandwidth).
  predictability_bw040:
    vibration: spectral
    gamma: 0.50
    frequency_scale: 1.0
    axes: [tx, ty, tz, rx, ry, rz]
    bands:
      tz:
        - {center_hz: 8.0, accel_rms: 1.000000, bandwidth_ratio: 0.40, tones: 12}
      tx:
        - {center_hz: 5.0, accel_rms: 0.500000, bandwidth_ratio: 0.40, tones: 12}
      ty:
        - {center_hz: 6.5, accel_rms: 0.350000, bandwidth_ratio: 0.40, tones: 10}
      rx:
        - {center_hz: 3.0, accel_rms: 0.461538, bandwidth_ratio: 0.40, tones: 12}
      ry:
        - {center_hz: 4.0, accel_rms: 0.461538, bandwidth_ratio: 0.40, tones: 10}
      rz:
        - {center_hz: 2.5, accel_rms: 0.230769, bandwidth_ratio: 0.40, tones: 8}
    seeds: [17, 31, 47, 73, 101]
    note: Wideband predictability control (40% relative bandwidth); same Gamma as bw000/bw010.
evaluation:
  success_xy_m: 0.07
  require_lift: true
  require_bilateral_finger_contact: true
  bilateral_contact_frames: 4
  report_wrist_6dof_peak: true
  official_score_requires_grasp_assist: false
  penetration_threshold_ratio: 0.01
  report_penetration_pair_and_time: true
